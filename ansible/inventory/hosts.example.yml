# ==========================================================================
# EXAMPLE inventory. The real one is generated by Terraform to
# ansible/inventory/hosts.yml (git-ignored) and is authoritative.
#
# This file documents the shape of the generated inventory and lets you
# syntax-check playbooks before any infrastructure exists.
#
# Copy to hosts.yml only for offline testing - Terraform will overwrite it.
# ==========================================================================
all:
  vars:
    ansible_user: rangeadmin
    ansible_password: "__FETCH_FROM_KEY_VAULT__"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_scheme: http
    ansible_port: 5985
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_operation_timeout_sec: 120
    ansible_winrm_read_timeout_sec: 180
    primary_domain: corp.contoso.lab
    primary_netbios: CORP
    primary_dc: DC01
    primary_dc_ip: 10.10.10.10
    dsrm_password: "__FETCH_FROM_KEY_VAULT__"

  children:
    domain_controllers:
      hosts:
        DC01:
          ansible_host: 10.10.10.10
          dc_domain: corp.contoso.lab
          dc_netbios: CORP
          dc_kind: forest_root
          dc_forest: corp
        DC02:
          ansible_host: 10.10.10.11
          dc_domain: partner.fabrikam.lab
          dc_netbios: PARTNER
          dc_kind: forest_root
          dc_forest: partner
        DC03:
          ansible_host: 10.10.10.12
          dc_domain: emea.corp.contoso.lab
          dc_netbios: EMEA
          dc_kind: child
          dc_forest: emea

    member_servers:
      hosts:
        SRV-FILE01: { ansible_host: 10.10.20.10, server_role: file }
        SRV-SQL01:  { ansible_host: 10.10.20.11, server_role: sql }
        SRV-ADCS01: { ansible_host: 10.10.20.12, server_role: adcs }
        SRV-IIS01:  { ansible_host: 10.10.20.13, server_role: iis }
        SRV-MGMT01: { ansible_host: 10.10.20.14, server_role: mgmt }
        SRV-APP01:  { ansible_host: 10.10.20.15, server_role: app }

    workstations:
      hosts:
        WS01: { ansible_host: 10.10.30.10 }
        WS02: { ansible_host: 10.10.30.11 }
        WS03: { ansible_host: 10.10.30.12 }
        WS04: { ansible_host: 10.10.30.13 }
        WS05: { ansible_host: 10.10.30.14 }
        WS06: { ansible_host: 10.10.30.15 }

    file_servers:
      hosts:
        SRV-FILE01: { ansible_host: 10.10.20.10 }
    sql_servers:
      hosts:
        SRV-SQL01: { ansible_host: 10.10.20.11 }
    adcs_servers:
      hosts:
        SRV-ADCS01: { ansible_host: 10.10.20.12 }
    iis_servers:
      hosts:
        SRV-IIS01: { ansible_host: 10.10.20.13 }
    management_servers:
      hosts:
        SRV-MGMT01: { ansible_host: 10.10.20.14 }
